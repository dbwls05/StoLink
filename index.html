<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoLink</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./css/common/variables.css" />
    <link rel="stylesheet" href="./css/common/header.css" />
    <link rel="stylesheet" href="./css/home.css" />
  </head>
  <body>
    <header class="site-header navy-section">
      <a href="/index.html" class="logo"
        ><img src="assets/logo/logo.svg" alt=""
      /></a>
      <nav class="user-menu d-flex align-items-center gap-2">
        <!-- <a href="/pages/search.html" class="login-link">탐색</a>
        <a href="/pages/library.html" class="login-link">내 보관함</a> -->
        <a
          href="/pages/login.html"
          class="login-link btn btn-outline-light rounded-pill"
          >로그인</a
        >
        <a href="/pages/signup.html" class="signup-btn">회원가입</a>
      </nav>
    </header>

    <section class="hero navy-section">
      <h1>이 배우,<br /><span class="accent">또 어디</span> 나왔더라?</h1>
      <p class="hero-sub">StoLink에서 콘텐츠 탐험을 시작하세요</p>
      <form class="index-search-bar" action="/pages/search.html">
        <svg
          class="search-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#475569"
          stroke-width="1.6"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="M17 17l5 5" />
        </svg>
        <input
          type="text"
          name="q"
          placeholder="작품명, 배우, 감독을 검색해보세요"
        />
        <button type="submit">검색</button>
      </form>
    </section>

    <main class="home">
      <section class="section">
        <div class="section-header">
          <h2>지금 인기있는 콘텐츠</h2>
          <a href="/pages/search.html" class="see-more">더보기</a>
        </div>
        <ul class="card-row" id="ranking-list"></ul>
      </section>

      <section class="section">
        <h2>OTT별로 보기</h2>
        <p class="section-desc">
          쓰고 있는 서비스를 고르면 거기서 볼 수 있는 작품만 나와요.
        </p>
        <div class="tab-group" role="tablist" id="ott-tabs">
          <button type="button" class="tab active" data-ott="넷플릭스">
            넷플릭스
          </button>
          <button type="button" class="tab" data-ott="디즈니+">디즈니+</button>
          <button type="button" class="tab" data-ott="티빙">티빙</button>
        </div>
        <ul class="card-row grid" id="ott-list"></ul>
      </section>

      <section class="section">
        <h2>유형별로 둘러보기</h2>
        <div class="category-grid">
          <a href="/pages/search.html" class="category-card">
            <span class="category-title">영화</span>
            <span class="category-desc">극장 개봉작과 OTT 영화</span>
          </a>
          <a href="/pages/search.html" class="category-card">
            <span class="category-title">드라마</span>
            <span class="category-desc">방송사 · OTT 시리즈</span>
          </a>
          <a href="/pages/search.html" class="category-card">
            <span class="category-title">TV 프로그램</span>
            <span class="category-desc">예능 · 다큐멘터리</span>
          </a>
          <a href="/pages/search.html" class="category-card">
            <span class="category-title">웹툰</span>
            <span class="category-desc">연재작과 완결작, 실사화 정보</span>
          </a>
        </div>
      </section>
    </main>
    <footer class="site-footer navy-section">
      <div>
        <span>© 2026 StoLink · 조유진 · 최명준 · 홍성재</span>
        <span>콘텐츠 정보: TMDB, 만화규장각</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/pages/home.js"></script>
    <script type="module" src="./js/common/header.js"></script>
  </body>
</html>
