<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoLink</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>

  <body>
    <header>
      <div class="logo">StoLink</div>

      <div class="user-menu">
        <a href="signup.html">회원가입</a>
        <a href="login.html">로그인</a>
      </div>
    </header>

    <main>
      <!-- 검색 영역 -->
      <section class="search-section">
        <h1>콘텐츠 탐험을 시작하세요</h1>

        <div class="search-box">
          <form action="search.html" method="get">
            <input type="text" name="query" placeholder="검색어 입력" />
            <button type="submit">검색</button>
          </form>
        </div>
      </section>

      <!-- 추천 콘텐츠 -->

      <section class="recommend-section">
        <h2>추천콘텐츠</h2>
        <div class="content-list">
          <a href="library.html?id=1" class="content-card">
            <div class="poster"></div>
            <h3>콘텐츠 제목</h3>
            <p>영화 · 액션</p>
          </a>

          <a href="library.html?id=2" class="content-card">
            <div class="poster"></div>
            <h3>콘텐츠 제목</h3>
            <p>드라마 · 로맨스</p>
          </a>

          <a href="library.html?id=3" class="content-card">
            <div class="poster"></div>
            <h3>콘텐츠 제목</h3>
            <p>웹툰 · 판타지</p>
          </a>
        </div>
      </section>
    </main>
    <div class="content-box"></div>
  </body>
</html>
