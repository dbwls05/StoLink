<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoLink 회원가입</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/common/variables.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <div class="auth-page navy-section">

      <main class="auth-main">
        <a class="auth-logo" href="../index.html">
          <img src="../assets/logo/logo.svg" alt="StoLink" />
        </a>

        <div class="auth-notice" role="status">
          내 보관함과 마이페이지는 로그인 후 이용할 수 있어요.
        </div>

        <section class="login-card">
          <div class="auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
            <a class="auth-tab" role="tab" aria-selected="false" href="./login.html">로그인</a>
            <a class="auth-tab is-active" role="tab" aria-selected="true" href="./signup.html">회원가입</a>
          </div>

          <div>
            <h1 class="login-title">StoLink 시작하기</h1>
            <p class="login-sub">보관함을 만들고 작품을 연결해 탐색해 보세요.</p>
          </div>

          <form id="signup-form" class="login-form">
            <label class="field">
              <span>이메일</span>
              <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </label>
            <label class="field">
              <span>비밀번호</span>
              <input type="password" name="password" placeholder="6자 이상" autocomplete="new-password" minlength="6" required />
            </label>
            <label class="field">
              <span>비밀번호 확인</span>
              <input type="password" name="password-check" autocomplete="new-password" required />
            </label>
            <p id="signup-error" class="error-msg"></p>
          </form>

          <div class="login-bottom">
            <button type="submit" class="btn-login" form="signup-form">회원가입</button>

            <div class="divider"><span></span>또는<span></span></div>

            <button type="button" class="btn-google" onclick="googleLogin()">
              <img src="../assets/logo/google_logo.svg" alt="" />
              Google 계정으로 계속하기
            </button>
          </div>

          <p class="auth-terms">
            계속하면 StoLink의 <a href="#">이용약관</a> 및
            <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
          </p>
        </section>
      </main>
    </div>

    <script type="module" src="../js/pages/signup.js"></script>
    <script type="module" src="../js/supabase/auth.js"></script>
  </body>
</html>
