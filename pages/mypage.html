<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지</title>
    <link rel="stylesheet" href="../css/mypage.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/common/variables.css" />
    <link rel="stylesheet" href="../css/common/header.css" />
  </head>

  <body>
    <header class="site-header navy-section">
      <a href="/index.html" class="logo"
        ><img src="../assets/logo/logo.svg" alt=""
      /></a>
      <form class="search-bar" action="search.html">
        <input type="text" name="q" />
      </form>
      <nav class="user-menu">
        <a href="/pages/login.html" class="login-link">로그인</a>
        <a href="/pages/signup.html" class="signup-btn">회원가입</a>
      </nav>
    </header>

    <main class="mypage">
      <section class="profile">
        <div class="profile-image"></div>

        <div class="profile-info">
          <h2 class="nickname">닉네임</h2>
          <h2 class="email">useremail@gmail.com</h2>
        </div>

        <div class="profile-button">
          <button type="button" class="edit-button">프로필 수정</button>
          <button type="button" class="logout-button">로그아웃</button>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <p class="stat-number">00</p>
          <p class="stat-label">총 저장한 콘텐츠</p>
        </div>

        <div class="stat-card">
          <p class="stat-number">00</p>
          <p class="stat-label">보는중</p>
        </div>

        <div class="stat-card">
          <p class="stat-number">00</p>
          <p class="stat-label">시청완료</p>
        </div>
      </section>

      <!-- 최근 저장한 콘텐츠 -->
      <section></section>
    </main>

    <script type="module" src="../js/common/header.js"></script>
    <script type="module" src="../js/pages/mypage.js"></script>
  </body>
</html>
