<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지</title>
    <link rel="stylesheet" href="../css/mypage.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/common/variables.css" />
    <link rel="stylesheet" href="../css/common/header.css" />
  </head>

  <body>
    <header class="site-header navy-section">
      <a href="/index.html" class="logo"
        ><img src="../assets/logo/logo.svg" alt=""
      /></a>
      <form class="search-bar" action="search.html">
        <input type="text" name="q" />
      </form>
      <nav class="user-menu">
        <a href="/pages/login.html" class="login-link">로그인</a>
        <a href="/pages/signup.html" class="signup-btn">회원가입</a>
      </nav>
    </header>

    <main class="mypage">
      <aside class="profile">
        <div class="profile-image"></div>
        <h2 class="nickname">닉네임</h2>
        <p class="email">useremail@gmail.com</p>
        <span class="provider-badge" hidden></span>
        <button type="button" class="edit-button">프로필 수정</button>
        <button type="button" class="logout-button">로그아웃</button>
      </aside>

      <div class="dashboard">
        <section class="block">
          <h3 class="block-title">시청 상태별 통계</h3>
          <div class="stats">
            <div class="stat-card">
              <p class="stat-label">저장한 콘텐츠</p>
              <p class="stat-number" data-stat="total">0</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">보고싶음</p>
              <p class="stat-number" data-stat="want">0</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">보는중</p>
              <p class="stat-number" data-stat="watching">0</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">시청함</p>
              <p class="stat-number" data-stat="done">0</p>
            </div>
          </div>
        </section>

        <section class="block">
          <h3 class="block-title">콘텐츠 이용 현황</h3>
          <div class="usage">
            <ul class="usage-list"></ul>
            <p class="usage-note"></p>
          </div>
        </section>

        <section class="block">
          <div class="block-head">
            <h3 class="block-title">최근 저장한 콘텐츠</h3>
            <a href="library.html" class="more-link">보관함 전체 보기</a>
          </div>
          <div class="recent-list"></div>
        </section>
      </div>
    </main>

    <script type="module" src="../js/common/header.js"></script>
    <script type="module" src="../js/pages/mypage.js"></script>
  </body>
</html>
