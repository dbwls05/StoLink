<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 상세페이지</title>

    <link rel="stylesheet" href="../css/work.css">
</head>

<body>

    <!-- 헤더 -->
    <header>

        <div class="logo">
            사이트 이름
        </div>

        <!-- 검색 -->
        <form class="search-box" action="search.html" method="GET">
            <input
                type="text"
                name="query"
                placeholder="검색어 입력"
            >
            <button type="submit">검색</button>
        </form>

        <!-- 회원 메뉴 -->
        <div class="user-menu">
            <a href="#">회원가입</a>
            <a href="#">로그인</a>
        </div>

    </header>


    <!-- 작품 상세 정보 -->
    <main>

        <section class="work-info">

            <!-- 포스터 -->
            <div class="poster">
                포스터
            </div>


            <!-- 작품 정보 -->
            <div class="work-detail">

                <h1>콘텐츠 제목</h1>

                <div class="basic-info">
                    <span>평점</span>
                    <span>장르</span>
                    <span>러닝타임</span>
                    <span>개봉일</span>
                </div>


                <!-- 저장 버튼 -->
                <button class="save-button" onclick="openModal()">
                    내 콘텐츠에 저장
                </button>


                <!-- 줄거리 -->
                <div class="story">
                    <h2>줄거리</h2>

                    <p>
                        콘텐츠의 줄거리가 들어가는 부분입니다.
                        콘텐츠에 대한 간단한 설명을 표시합니다.
                    </p>
                </div>


                <!-- 배우 -->
                <section class="people-section">

                    <h2>배우</h2>

                    <div class="people-list">

                        <a href="actor.html?id=1" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>배우이름</p>
                        </a>

                        <a href="actor.html?id=2" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>배우이름</p>
                        </a>

                        <a href="actor.html?id=3" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>배우이름</p>
                        </a>

                        <a href="actor.html?id=4" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>배우이름</p>
                        </a>

                        <a href="actor.html?id=5" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>배우이름</p>
                        </a>

                        <a href="people.html?workId=1" class="more">더보기 ></a>
                        
                    </div>

                </section>


                <!-- 감독 / 제작진 -->
                <section class="people-section">

                    <h2>제작진</h2>

                    <div class="people-list">

                        <a href="director.html?id=1" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>감독이름</p>
                        </a>

                        <a href="director.html?id=2" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>제작진이름</p>
                        </a>

                        <a href="director.html?id=3" class="people-card">
                            <div class="people-image">
                                사진
                            </div>
                            <p>제작진이름</p>
                        </a>

                        <a href="people.html?workId=1" class="more">더보기 ></a>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <!-- 저장 모달 -->
    <div id="save-modal" class="modal">

        <div class="modal-content">

            <h2>내 콘텐츠에 저장</h2>

            <p>현재 작품을 어떤 상태로 저장할까요?</p>

            <div class="save-options">

                <button onclick="saveContent('보고싶음')">
                    보고싶음
                </button>

                <button onclick="saveContent('보는중')">
                    보는중
                </button>

                <button onclick="saveContent('시청완료')">
                    시청완료
                </button>

            </div>

            <button class="cancel-button" onclick="closeModal()">
                취소
            </button>

        </div>

    </div>


    <script src="../js/work.js"></script>

</body>
</html>
