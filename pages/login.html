<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoLink</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <a href="../index.html"
        ><img class="stolink-logo" src="../assets/logo/logo.svg" alt="StoLink"
      /></a>

      <section class="login-card">
        <h1 class="login-title">로그인</h1>

        <button type="button" class="btn-google" onclick="googleLogin()">
          <img src="../assets/logo/google_logo.svg" alt="" />
          <p>Google로 로그인하기</p>
        </button>

        <div class="divider">
          <span></span>
          <p>or</p>
          <span></span>
        </div>
        
        <form id="login-form" class="login-form" action="main.html">
          <input
            type="email"
            name="email"
            placeholder="이메일"
            autocomplete="email"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="비밀번호"
            autocomplete="current-password"
            required
          />
          <a class="forgot-link" href="#">비밀번호를 잊으셨나요?</a>

          <p id="login-error" class="error-msg"></p>
        </form>

        <div class="login-bottom">
          <button type="submit" class="btn-login" form="login-form">
            로그인
          </button>

          <a class="signup-link" href="./signup.html">
            아직 계정이 없다면? <span>회원가입</span>
          </a>
        </div>
      </section>
    </div>

    <script type="module" src="../js/pages/login.js"></script>
    <script type="module" src="../js/supabase/auth.js"></script>
  </body>
</html>
